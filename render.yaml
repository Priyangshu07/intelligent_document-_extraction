services:
  - type: web
    name: findoc-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: AI_PROVIDER
        value: google
      - key: AI_MODEL
        value: gemini-3.6-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: findoc-db
          property: connectionString
      - key: MAX_PAGES
        value: "3"
      - key: VALIDATION_ABS_TOLERANCE
        value: "1.0"
      - key: VALIDATION_REL_TOLERANCE
        value: "0.005"
      - key: LOG_LEVEL
        value: INFO
      - key: APP_NAME
        value: "Financial Document Intelligence Platform"
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: findoc-db
    databaseName: docai
    user: docai
    plan: free
    region: oregon
